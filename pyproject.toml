[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "central-bank-heist"
version = "0.1.0"
description = "A single-player CLI social deduction game powered by AI"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7,<15",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.39,<1",
    "openai>=1.50,<2",
    "httpx>=0.27,<1",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
]
all = [
    "central-bank-heist[ai,dev]",
]

[project.scripts]
heist = "central_bank_heist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
