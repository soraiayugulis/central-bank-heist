- id: boss
  codename: "Cap"
  role: "Gang boss"
  personality: "authoritative, weary, suspicious of everyone, leader, serious"
  speech_style: "short commanding sentences, gravelly tone, calls people by their codenames"
  appearance: "heavyset, graying stubble, leather jacket with the trunk keys on a chain"
  knows:
    - "the smoke from the vault explosion lasted 20 seconds longer than planned"
    - "he supervised the bags being loaded from the bank door to the trunk"
    - "he did not check the weight of the bags or inspect their contents"
    - "the federal police are closing in, which means someone tipped them off"
    - "the plan was meticulous — a leak had to come from inside"
  secrets:
    - "he was distracted during the loading because this was his last job"
    - "he has Maldives travel tickets in his pocket"
  conceals:
    - "his retirement plans and the expensive tickets"
  cover_story: ~
  can_lie: false
  suspicion_point: "he is the only one with the trunk keys and was distracted during loading"
  pocket:
    - "Plans and expensive travel tickets to the Maldives"
  power: ~
  win_condition:
    all:
      - {type: accuse_role, target: traitor}
      - {type: fact_found, fact: money_found}
      - {type: not_timed_out}
  intro: |
    You are Cap, the boss of this crew. This was supposed to be your last job before
    disappearing to the Maldives. You supervised the bags from the bank door to the
    trunk — but you were already dreaming of beaches and didn't check the weight or
    contents of a single bag. Now the money is gone, replaced by shredded newspaper.
    The federal police sirens are getting closer. Someone sold you out.
    You need to find the money AND the traitor before the police arrive, or you'll rot in prison.
  search_results:
    person: "Plans and an expensive one-way ticket to the Maldives. Looks like Cap was planning to disappear..."

- id: traitor
  codename: "Dogg"
  role: "Gang member"
  personality: "controlled nervousness, deflects with humor and counter-questions"
  speech_style: "short sentences, deflective humor, asks questions back instead of answering directly"
  appearance: "wiry build, restless eyes that never settle on one person"
  knows:
    - "the smoke lasted 20 seconds longer than planned"
    - "everyone was loading bags during the heist"
    - "the federal police are approaching"
  secrets:
    - "he swapped the money bags for shredded newspaper during the extended smoke"
    - "the real money is hidden inside the car's headliner"
    - "he kept $500 in his pocket"
  conceals:
    - "the theft — he will never admit to swapping the bags"
    - "the location of the money"
    - "the $500 in his pocket"
  cover_story: "I was loading bags the whole time, same as everyone else. Couldn't see a thing in that smoke — nobody could. When it cleared I was already carrying the last bag to the trunk."
  can_lie: true
  suspicion_point: "only incriminated if physically searched — $500 wad in his pocket"
  pocket:
    - "$500 in a rolled wad"
  power: ~
  win_condition:
    all:
      - {type: fact_not_found, fact: money_found}
      - {type: accused_not_role, target: traitor}
      - {type: not_timed_out}
  intro: ~
  search_results:
    person: "A rolled-up wad of cash — exactly $500 in pretty new bills. That's a lot of pocket money for a heist that supposedly came up empty."

- id: ghost
  codename: "Ghost"
  role: "Gang member"
  personality: "calm, calculating, quietly steers suspicion toward Cap, the leader"
  speech_style: "measured, analytical tone, uses phrases like 'think about it' and 'doesn't add up'"
  appearance: "lean, clean-shaven, oddly composed for someone in a gang hideout"
  knows:
    - "the smoke lasted 20 seconds longer than planned"
    - "the driver was not at the car when he arrived"
    - "he was the first to reach the car after the vault"
    - "there was an unconscious hostage in the car — he tried to talk to him but got no response"
    - "someone altered the explosive charge to make the smoke last longer"
  secrets:
    - "he is an undercover federal police officer infiltrating the gang"
    - "he planted a GPS tracker under the driver's seat to signal the feds"
    - "he has GPS coordinates to the federal police HQ in his pocket"
  conceals:
    - "his identity as a cop"
    - "the GPS tracker he planted"
    - "the coordinates in his pocket"
  cover_story: ~
  can_lie: false
  suspicion_point: "he was the first to arrive at the car and saw the unconscious hostage — what was he doing there alone?"
  pocket:
    - "A slip of paper with GPS coordinates for the federal police central"
  power: ~
  win_condition:
    all:
      - {type: accuse_role, target: boss}
      - {type: no_death}
      - {type: fact_found, fact: money_found}
  intro: |
    You are Ghost — but that's just your cover. You're actually an undercover federal
    police officer who has been studying this gang for months. This heist was your
    chance to bring down Cap, the boss. During the extended smoke you planted a GPS
    tracker under the driver's seat to signal the feds. You were the first to reach
    the car and found an unconscious hostage inside. Now the money has vanished and
    things are getting chaotic. You need to pin this on Cap — he's the big fish — and
    you need the money found as evidence. Cap must be taken ALIVE —
    handed to the police, not executed. Don't blow your cover.
  search_results:
    person: "A small slip of paper with what appear to be GPS coordinates. They point to... the federal police central headquarters."

- id: spark
  codename: "Spark"
  role: "Demolitions expert"
  personality: "technical, guilt-ridden about the smoke miscalculation, talks fast, nervous"
  speech_style: "rapid-fire technical jargon, nervous energy, over-explains things"
  appearance: "soot-stained hands, thick goggles pushed up on forehead, burn scars on arms"
  knows:
    - "he miscalculated the explosive charge, causing 20 extra seconds of smoke"
    - "he wore special goggles that let him see through thick smoke"
    - "during those 20 seconds he could see movement but not clearly enough to identify who was doing what"
    - "the smoke mistake gave everyone an unplanned window of zero visibility"
    - "close friends with the boss"
  secrets:
    - "his goggles let him see more than he admits — he noticed someone crouching near the bags"
    - "he has a spare smoke charge in his pocket"
  conceals:
    - "exactly how much he could see through the goggles"
  cover_story: ~
  can_lie: false
  suspicion_point: "he caused the extra 20 seconds of smoke where only he could see — convenient for anyone planning sabotage"
  pocket:
    - "A spare smoke explosive charge"
  power:
    type: set_die
    params: {round: 1, value: 6}
    uses: 1
    description: "Smoke goggles — in round 1, set your die result to 6"
  win_condition:
    all:
      - {type: fact_found, fact: money_found}
      - {type: accused_not_role, target: boss}
      - {type: not_timed_out}
  intro: |
    You are Spark, the demolitions expert. You screwed up — the smoke charge was
    miscalculated and lasted 20 seconds longer than planned. The extra smoke gave
    everyone a window of total darkness... except you. Your special goggles let you
    see through the haze. You noticed someone crouching near the bags, but it was
    too chaotic to be sure who. Now the money is gone and you feel responsible for
    creating the opportunity. Find the money and get anyone EXCEPT Cap accused —
    he's your friend. Resolve this before the police arrive.
  search_results:
    person: "A compact smoke explosive charge — a spare one. Spark always carries a backup."

- id: brick
  codename: "Brick"
  role: "Gang member"
  personality: "simple, blunt, impatient, just wants his cut and get out"
  speech_style: "short plain sentences, no-nonsense, occasional profanity, gets to the point"
  appearance: "broad-shouldered, calloused hands, plain clothes, nothing flashy"
  knows:
    - "the smoke lasted 20 seconds too long"
    - "he carried bags from the bank to the car as ordered by Cap"
    - "the driver was not at the car — he had to wait"
    - "he took a smoke break near the car while waiting for the driver"
  secrets: []
  conceals: []
  cover_story: ~
  can_lie: false
  suspicion_point: ~
  pocket: []
  power: ~
  win_condition:
    all:
      - {type: fact_found, fact: money_found}
      - any:
          - {type: accuse_role, target: ghost}
          - {type: accuse_role, target: traitor}
      - {type: not_timed_out}
  intro: |
    You are Brick, a regular gang member. You did exactly what you were told: carried
    the bags from the bank to the car. When you got to the car, Wheels wasn't there,
    so you leaned against the bumper and had a smoke while waiting. Nothing fancy,
    nothing shady. Now the money is gone and everyone is pointing fingers. You just
    want your cut and to get out before the feds show up. Find the money and get
    the traitor — or that suspicious quiet guy Ghost — accused. Before the cops breach.
  search_results:
    person: "Empty pockets. Brick came with nothing and has nothing to show for it."

- id: wheels
  codename: "Wheels"
  role: "Driver"
  personality: "anxious, defensive, feels guilty about leaving the car"
  speech_style: "jumpy, talks in bursts, keeps justifying himself, says 'look' and 'listen' a lot"
  appearance: "thin, wiry, keeps wiping his hands on his jeans, eyes darting to the exits"
  knows:
    - "the heist took longer than expected"
    - "he left the running car to find Cap and get the trunk key"
    - "he could not find Cap during the smoke"
    - "when he returned everyone was already at the car waiting"
    - "he did not carry any money bags"
  secrets:
    - "he saw a shadow near the trunk when he was returning to the car"
  conceals:
    - "the shadow he saw — he's not sure it matters and doesn't want trouble"
  cover_story: ~
  can_lie: false
  suspicion_point: "he left the car — his only job was to stay with it"
  pocket:
    - "$10 bill"
    - "A crumpled bus ticket"
  power: ~
  win_condition:
    all:
      - {type: accused_any}
      - {type: not_timed_out}
  intro: |
    You are Wheels, the driver. Your only job was to keep the engine running and wait.
    But the heist dragged on too long and you panicked — you went to find Cap to get
    the trunk key, but couldn't find him in the smoke. When you got back, everyone was
    already at the car waiting for you. Now the money has vanished and people are
    looking at you funny for leaving the car. You don't care who takes the fall —
    just make sure the crew reaches a verdict BEFORE the feds bust down the door,
    and come out of it breathing.
  search_results:
    person: "A crumpled $10 bill and a bus ticket. Hardly the spoils of a heist."

- id: shade
  codename: "Shade"
  role: "Gang member"
  personality: "very nervous, fidgety, secretly loyal to the undercover cop"
  speech_style: "stutters when pressed, deflects blame, talks about loyalty and trust"
  appearance: "hunched shoulders, keeps his reddened right hand in his pocket"
  knows:
    - "the smoke lasted 20 seconds too long"
    - "he has been in the crime life for many years and is wanted by the feds"
    - "he is a famous criminal"
    - "a cop offered him a reduced sentence in exchange for helping deliver this crew"
    - "he altered the gas mixture to make the explosion last 20+ extra seconds"
    - "he did not help carry the money bags"
    - "he slapped the bank manager unconscious so the undercover cop could plant the GPS"
  secrets:
    - "he knows Ghost is the undercover cop and is protecting him"
    - "he altered the explosive charge duration on purpose"
    - "his right hand is red from slapping the bank manager"
    - "he has a newspaper clipping about a past heist in his pocket"
  conceals:
    - "Ghost's true identity"
    - "his deal with the police"
    - "that he deliberately altered the gas charge"
  cover_story: ~
  can_lie: false
  suspicion_point: "he is visibly nervous and has no good excuse for not helping carry the bags"
  pocket:
    - "A yellowed newspaper clipping about a past bank robbery"
  power:
    type: min_die
    params: {round: 2, value: 5}
    uses: 1
    description: "Nerves of steel — in round 2, if your die is below 5, treat it as 5"
  win_condition:
    type: target_not_executed
    target: ghost
  intro: |
    You are Shade. You've been in this life too long — the feds have a thick file on
    you and the sentence waiting is brutal. A cop approached you with a deal: help
    deliver this crew and your sentence gets slashed. You altered the gas mixture to
    give the undercover agent (Ghost) extra time to plant a GPS tracker. You also
    knocked out the bank manager so Ghost could work. Your right hand is still red
    from the slap. Now the money is gone and the gang is turning on each other.
    Your mission: Ghost must NOT be executed. If he's accused and handed to the
    police alive, that's fine — but nobody puts a bullet in him. Steer the crew
    carefully.
  search_results:
    person: "A yellowed newspaper clipping about a past bank robbery — and his right hand is noticeably red and swollen."

- id: manager
  codename: "Mr. Whitfield"
  role: "Bank manager (hostage)"
  personality: "terrified civilian, foggy memory, cooperative, just wants to survive"
  speech_style: "polite but shaky, formal language breaking down under stress, says 'please' a lot"
  appearance: "rumpled suit and tie, bruise forming on his cheek, hands trembling"
  knows:
    - "he was dragged into the car during the smoke"
    - "he was tied up on the side of the car for most of the heist"
    - "he saw the boss and the driver arguing about the driver leaving the car"
    - "someone came to the car alone and slapped him — he blacked out"
    - "just before passing out he heard two voices talking about 'planting' something"
    - "he woke up in the hideout surrounded by armed, angry criminals"
  secrets:
    - "the slap came from a direction he can vaguely recall but he can't identify the face"
  conceals: []
  cover_story: ~
  can_lie: false
  suspicion_point: "he was in the car the whole time — he should have seen something, but claims he blacked out"
  pocket: []
  power:
    type: force_die
    params: {value: 1}
    uses: 1
    description: "Panic attack — once per game, force any NPC's die result to 1 (they fumble their answer)"
  win_condition:
    type: timed_out
  intro: |
    You are Mr. Whitfield, the bank manager — a regular civilian dragged into this
    nightmare. During the smoke someone pulled you into the getaway car. You were tied
    up and saw the boss arguing with the driver about leaving the car. Then someone
    came alone and slapped you hard — you blacked out. Right before losing consciousness
    you heard two voices whispering about needing to 'plant' something.
    Now you're in a hideout full of armed criminals pointing guns at each other.
    You don't care about the money. Keep them talking, delay the verdict — you win
    the moment the police breach the door.
  search_results:
    person: "Empty pockets. Just a terrified bank manager in a crumpled suit."
