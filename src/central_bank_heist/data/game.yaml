time_limit_minutes: 20            # 0 or negative = disabled
repeat_question_threshold: 3      # Nth question to same NPC triggers penalty
repeat_penalty_minutes: 2         # minutes lost per trigger
accusation_min_round2_actions: 2  # round-2 actions needed to unlock accusation
statement_log_max: 10             # max per-NPC statements kept in prompt context
